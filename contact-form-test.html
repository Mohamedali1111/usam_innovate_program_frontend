<!DOCTYPE html>
<html>
<head>
    <title>Contact Form Setup</title>
</head>
<body>
    <h1>Contact Form Setup</h1>
    <p>This form will be used to test Formspree integration.</p>
    
    <form action="https://formspree.io/f/xpwgkqyw" method="POST">
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
        </div>
        
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>
        
        <div>
            <label for="message">Message:</label>
            <textarea id="message" name="message" required></textarea>
        </div>
        
        <div>
            <input type="hidden" name="_subject" value="New Contact Form Submission">
            <input type="hidden" name="_replyto" value="">
            <input type="hidden" name="_next" value="https://mohamed-ali-portfolio-ten.vercel.app">
        </div>
        
        <div>
            <button type="submit">Send Message</button>
        </div>
    </form>
</body>
</html>
